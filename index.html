<!doctype html>
<!-- Papote public root page (GitHub Pages of GuyFran/papote). Source of truth: site/ in papote-core. Static: stores and sends nothing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#18163A">
<title>Papote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --ink:#211C4E; --sub:#5D5A7A; --bg:#F1F1F7; --night:#18163A; --yellow:#FFD84A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
    background: var(--bg); color: var(--ink); text-align: center; font: 400 16px/1.55 'Instrument Sans', system-ui, sans-serif; }
  .logo { width: 72px; height: 72px; margin: 0 auto 16px; border-radius: 18px; background: var(--night); display: grid; place-items: center;
    color: var(--yellow); font: 600 38px/1 Fredoka, sans-serif; }
  h1 { font: 600 32px/1.1 Fredoka, sans-serif; margin: 0 0 10px; }
  p { color: var(--sub); max-width: 40ch; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">P</div>
  <h1>Papote</h1>
  <p>A French course for the whole family, on tablets, phones and the PC. Got an invite? Open its link on the device where Papote is installed.</p>
</main>
</body>
</html>
